<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1066" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050813"/>
      <stop offset="40%" stop-color="#090f24"/>
      <stop offset="80%" stop-color="#04060c"/>
      <stop offset="100%" stop-color="#020306"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="glowGreen" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowBlue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Developer Skin & Lighting Gradients -->
    <radialGradient id="faceGrad" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#d49a75"/>
      <stop offset="60%" stop-color="#a46949"/>
      <stop offset="90%" stop-color="#643b23"/>
      <stop offset="100%" stop-color="#3d2112"/>
    </radialGradient>

    <linearGradient id="rimCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#0080ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eae6dd"/>
      <stop offset="50%" stop-color="#cfc9bc"/>
      <stop offset="100%" stop-color="#948e81"/>
    </linearGradient>

    <linearGradient id="ambientGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>

    <!-- Matrix Code pattern -->
    <pattern id="matrixPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <text x="5" y="15" fill="#00e5ff" opacity="0.12" font-family="monospace" font-size="11">1 0 1</text>
      <text x="20" y="35" fill="#00e5ff" opacity="0.08" font-family="monospace" font-size="11">0 1 0</text>
      <text x="10" y="55" fill="#38bdf8" opacity="0.10" font-family="monospace" font-size="11">1 1 0</text>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Ambient Light Glow Behind Head -->
  <circle cx="480" cy="400" r="320" fill="url(#ambientGlow)" />
  <circle cx="280" cy="220" r="180" fill="#00f2fe" opacity="0.08" filter="url(#glowBlue)" />

  <!-- Background Matrix Texture -->
  <rect width="100%" height="100%" fill="url(#matrixPattern)" />

  <!-- ================= BACKGROUND TECH LOGOS ================= -->

  <!-- 1. GITHUB OCTOCAT (Top-Left Hologram) -->
  <g transform="translate(140, 110)" filter="url(#glowBlue)">
    <circle cx="70" cy="70" r="68" fill="#00e5ff" opacity="0.12" />
    <circle cx="70" cy="70" r="65" stroke="#38bdf8" stroke-width="2" fill="#0c192e" opacity="0.85"/>
    <path d="M70 24C44.6 24 24 44.6 24 70c0 20.3 13.2 37.5 31.5 43.6 2.3.4 3.1-1 3.1-2.2v-7.8c-12.8 2.8-15.5-6.2-15.5-6.2-2.1-5.3-5.1-6.7-5.1-6.7-4.2-2.9.3-2.8.3-2.8 4.6.3 7 4.7 7 4.7 4.1 7 10.8 5 13.4 3.8.4-3 1.6-5 2.9-6.2-10.2-1.2-21-5.1-21-22.8 0-5 1.8-9.2 4.8-12.4-.5-1.2-2.1-5.9.5-12.2 0 0 3.9-1.2 12.7 4.7 3.7-1 7.7-1.5 11.6-1.5 3.9 0 7.9.5 11.6 1.5 8.8-6 12.7-4.7 12.7-4.7 2.6 6.4 1 11 0.5 12.2 3 3.3 4.8 7.4 4.8 12.4 0 17.8-10.8 21.6-21.1 22.7 1.7 1.4 3.1 4.3 3.1 8.6v12.8c0 1.2.8 2.7 3.2 2.2C102.8 107.5 116 90.3 116 70c0-25.4-20.6-46-46-46z" fill="#38bdf8" />
  </g>

  <!-- 2. NODE.JS (Top-Center Neon Hexagon) -->
  <g transform="translate(350, 80)" filter="url(#glowGreen)">
    <polygon points="65,15 115,44 115,102 65,131 15,102 15,44" fill="#14321d" stroke="#22c55e" stroke-width="3" opacity="0.9" />
    <path d="M65 35 L98 54 L98 92 L65 111 L32 92 L32 54 Z" fill="#22c55e" opacity="0.3" />
    <!-- Node Text -->
    <text x="65" y="78" fill="#4ade80" font-family="'Courier New', monospace" font-weight="900" font-size="28" text-anchor="middle" letter-spacing="1">node</text>
    <text x="65" y="100" fill="#86efac" font-family="sans-serif" font-weight="bold" font-size="15" text-anchor="middle">.JS</text>
  </g>

  <!-- 3. EXPRESS.JS (Top-Right Typography) -->
  <g transform="translate(540, 130)">
    <text x="0" y="0" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-weight="300" font-size="34" letter-spacing="2" filter="url(#glowCyan)" opacity="0.95">
      express<tspan fill="#38bdf8" font-weight="bold">.js</tspan>
    </text>
  </g>

  <!-- 4. REACT (Right Glowing Atom) -->
  <g transform="translate(620, 240)" filter="url(#glowCyan)">
    <!-- Central Nucleus -->
    <circle cx="65" cy="80" r="14" fill="#00f0ff" />
    <!-- Orbiting Ellipses -->
    <ellipse cx="65" cy="80" rx="55" ry="20" fill="none" stroke="#00f0ff" stroke-width="4" stroke-opacity="0.9" />
    <ellipse cx="65" cy="80" rx="55" ry="20" fill="none" stroke="#00f0ff" stroke-width="4" stroke-opacity="0.9" transform="rotate(60 65 80)" />
    <ellipse cx="65" cy="80" rx="55" ry="20" fill="none" stroke="#00f0ff" stroke-width="4" stroke-opacity="0.9" transform="rotate(120 65 80)" />
  </g>

  <!-- 5. MONGODB (Left Glowing Leaf & Text) -->
  <g transform="translate(40, 320)" filter="url(#glowGreen)">
    <!-- Leaf Icon -->
    <path d="M45 10 C35 35, 10 55, 30 90 C38 105, 45 115, 45 115 C45 115, 52 105, 60 90 C80 55, 55 35, 45 10 Z" fill="#22c55e" />
    <path d="M45 10 L45 115" stroke="#14532d" stroke-width="2" />
    <!-- Text -->
    <text x="80" y="80" fill="#4ade80" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="36" letter-spacing="0.5">mongo<tspan fill="#86efac">DB</tspan></text>
  </g>

  <!-- 6. MONGODB CIRCULAR BADGE (Lower-Left Hologram) -->
  <g transform="translate(80, 460)" filter="url(#glowGreen)">
    <circle cx="65" cy="65" r="55" fill="#0d2417" stroke="#22c55e" stroke-width="2" opacity="0.75" />
    <path d="M65 25 C58 45, 40 60, 55 85 C61 95, 65 102, 65 102 C65 102, 69 95, 75 85 C90 60, 72 45, 65 25 Z" fill="#22c55e" opacity="0.9" />
  </g>

  <!-- 7. DOCKER WHALE (Center-Right Neon Logo) -->
  <g transform="translate(600, 440)" filter="url(#glowBlue)">
    <!-- Whale Body -->
    <path d="M20 75 C35 75, 45 60, 60 60 C80 60, 95 85, 130 85 C145 85, 155 75, 165 65 C162 85, 140 105, 100 105 C50 105, 20 85, 20 75 Z" fill="#38bdf8" />
    <!-- Spout / Tail -->
    <path d="M145 65 C160 50, 175 55, 180 50 C175 65, 160 70, 155 72 Z" fill="#38bdf8" />
    <!-- Containers on Whale Back -->
    <rect x="50" y="45" width="12" height="10" fill="#38bdf8" rx="1" />
    <rect x="65" y="45" width="12" height="10" fill="#38bdf8" rx="1" />
    <rect x="80" y="45" width="12" height="10" fill="#38bdf8" rx="1" />
    <rect x="65" y="32" width="12" height="10" fill="#38bdf8" rx="1" />
    <rect x="80" y="32" width="12" height="10" fill="#38bdf8" rx="1" />
    <!-- Docker Text -->
    <text x="30" y="135" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" letter-spacing="1">docker</text>
  </g>

  <!-- ================= DEVELOPER SUBJECT (SRIRAM) ================= -->

  <!-- Body / Patterned Collared Shirt -->
  <g id="developer-body" transform="translate(0, 520)">
    <!-- Shoulders & Torso Silhouette -->
    <path d="M120 546 L200 120 L300 90 L400 120 L480 90 L580 120 L680 546 Z" fill="url(#shirtGrad)" />
    
    <!-- Abstract Sharp Line Patterns on Shirt (Hand-drawn geometric scribbles matching image) -->
    <g stroke="#262626" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
      <!-- Left shoulder pattern -->
      <path d="M210 160 L230 140 L250 170 M215 180 L245 185 M230 190 L220 220 L240 210" />
      <path d="M180 250 L210 230 L200 270 M160 300 L190 290 L180 330" />
      <path d="M220 270 L250 250 L270 280 M240 320 L270 300 L260 350" />
      <!-- Chest pattern -->
      <path d="M310 180 L340 160 L330 200 M350 210 L380 190 L370 230" />
      <path d="M280 240 L310 220 L330 250 M300 280 L340 270 L320 310" />
      <path d="M360 270 L390 250 L410 280 M370 320 L400 300 L390 350" />
      <path d="M320 360 L350 340 L370 380 M270 390 L300 370 L320 410" />
      <!-- Right shoulder & arm pattern -->
      <path d="M470 170 L500 150 L490 190 M520 200 L550 180 L540 220" />
      <path d="M450 240 L480 220 L500 250 M470 290 L510 270 L490 320" />
      <path d="M530 260 L560 240 L580 280 M550 320 L580 300 L570 350" />
      <path d="M430 360 L470 340 L460 390 M500 380 L540 360 L530 420" />
    </g>

    <!-- Shirt Collar -->
    <polygon points="320,80 390,170 390,95" fill="#dfdad0" stroke="#a39d8f" stroke-width="2" />
    <polygon points="460,80 390,170 390,95" fill="#cfc9bd" stroke="#8c8678" stroke-width="2" />
    
    <!-- Button Placket -->
    <path d="M385 170 L385 540 L405 540 L405 170 Z" fill="#b8b2a3" />
    <circle cx="395" cy="230" r="4" fill="#333" />
    <circle cx="395" cy="330" r="4" fill="#333" />
    <circle cx="395" cy="430" r="4" fill="#333" />

    <!-- Left & Right Volumetric Rim Light on Shirt -->
    <path d="M120 546 L200 120 L240 180 L180 546 Z" fill="url(#rimCyan)" opacity="0.6" />
    <path d="M680 546 L580 120 L550 190 L640 546 Z" fill="#00e5ff" opacity="0.3" filter="url(#glowCyan)" />
  </g>

  <!-- Neck -->
  <path d="M345 470 L345 540 C345 560, 435 560, 435 540 L435 470 Z" fill="#7a472c" />
  <!-- Neck Shadow -->
  <path d="M345 470 C375 510, 415 510, 435 470 L435 490 C405 525, 365 525, 345 490 Z" fill="#4d2c1b" />

  <!-- Head & Facial Features -->
  <g id="developer-head">
    <!-- Ears -->
    <ellipse cx="320" cy="435" rx="14" ry="24" fill="#915938" transform="rotate(-5 320 435)" />
    <ellipse cx="495" cy="450" rx="15" ry="26" fill="#845030" transform="rotate(8 495 450)" />
    <!-- Ear rim light -->
    <path d="M495 430 C510 445, 510 465, 495 475" stroke="#00f0ff" stroke-width="3" fill="none" opacity="0.8" filter="url(#glowCyan)" />

    <!-- Face Silhouette (Looking 3/4 to the left) -->
    <path d="M330 350 C310 420, 325 480, 360 525 C390 560, 430 550, 460 515 C490 480, 500 400, 480 340 Z" fill="url(#faceGrad)" />
    
    <!-- Jawline Shadow & Definition -->
    <path d="M350 490 C380 540, 430 530, 460 495" stroke="#4a2a16" stroke-width="4" fill="none" opacity="0.5" />

    <!-- Beard / Stubble Shadow -->
    <path d="M345 470 C360 520, 430 525, 455 480 C445 510, 370 510, 345 470 Z" fill="#2d1a0e" opacity="0.45" />

    <!-- Nose -->
    <path d="M380 395 L372 450 L390 455 L398 445" stroke="#4d2c18" stroke-width="2.5" fill="#a46949" opacity="0.8" />

    <!-- Lips -->
    <path d="M370 480 C382 475, 402 476, 412 482" stroke="#5a2f1b" stroke-width="3" fill="none" />
    <path d="M375 488 C385 494, 400 494, 410 488" stroke="#7a4025" stroke-width="2.5" fill="none" />

    <!-- Eyes & Brows -->
    <!-- Left Eye -->
    <ellipse cx="365" cy="415" rx="14" ry="7" fill="#26150b" />
    <circle cx="364" cy="415" r="4" fill="#000" />
    <circle cx="366" cy="413" r="1.5" fill="#fff" />
    <path d="M350 400 C360 393, 375 393, 385 400" stroke="#1f1109" stroke-width="5" stroke-linecap="round" fill="none" />

    <!-- Right Eye -->
    <ellipse cx="430" cy="420" rx="14" ry="7" fill="#26150b" />
    <circle cx="429" cy="420" r="4" fill="#000" />
    <circle cx="431" cy="418" r="1.5" fill="#fff" />
    <path d="M415 403 C428 397, 442 398, 452 405" stroke="#1f1109" stroke-width="5" stroke-linecap="round" fill="none" />

    <!-- Modern Spectacles / Glasses (Matching reference image) -->
    <!-- Frame -->
    <g stroke="#38bdf8" stroke-width="3" fill="none" opacity="0.95" filter="url(#glowCyan)">
      <!-- Left Lens Frame -->
      <rect x="342" y="395" width="46" height="38" rx="10" stroke="#67e8f9" fill="#00e5ff" fill-opacity="0.08" />
      <!-- Right Lens Frame -->
      <rect x="408" y="400" width="48" height="38" rx="10" stroke="#67e8f9" fill="#00e5ff" fill-opacity="0.08" />
      <!-- Bridge -->
      <path d="M388 410 C398 406, 402 406, 408 410" stroke="#a5f3fc" stroke-width="3.5" />
      <!-- Temple Arms -->
      <path d="M342 408 L320 425" stroke="#67e8f9" stroke-width="2.5" />
      <path d="M456 414 L485 435" stroke="#67e8f9" stroke-width="2.5" />
      <!-- Glare / Reflection on Glasses -->
      <line x1="348" y1="400" x2="368" y2="428" stroke="#ffffff" stroke-width="2" opacity="0.6" stroke-linecap="round" />
      <line x1="414" y1="405" x2="434" y2="433" stroke="#ffffff" stroke-width="2" opacity="0.6" stroke-linecap="round" />
    </g>

    <!-- Hair (Voluminous stylish textured dark hair matching image) -->
    <path d="M315 360 C300 290, 340 230, 410 225 C470 220, 520 260, 510 340 C525 350, 500 400, 485 410 C480 340, 470 310, 420 305 C370 300, 335 320, 315 360 Z" fill="#17120e" />
    
    <!-- Hair Texture Strands -->
    <g fill="#0c0a08" opacity="0.9">
      <path d="M340 270 C360 230, 400 225, 430 235 C420 260, 380 270, 340 270 Z" />
      <path d="M420 230 C450 235, 490 255, 495 295 C475 285, 450 280, 420 230 Z" />
      <path d="M315 330 C325 290, 360 280, 375 295 C350 310, 330 330, 315 330 Z" />
    </g>

    <!-- Hair Neon Cyan Rim Highlight -->
    <path d="M480 250 C515 290, 515 350, 495 400" stroke="#00f0ff" stroke-width="4.5" fill="none" opacity="0.85" filter="url(#glowCyan)" />
  </g>

  <!-- Ambient Forefront Sparkles & Lighting Particles -->
  <g fill="#00f0ff" opacity="0.75" filter="url(#glowCyan)">
    <circle cx="210" cy="280" r="2.5" />
    <circle cx="670" cy="200" r="3" />
    <circle cx="180" cy="620" r="2" />
    <circle cx="610" cy="680" r="3" />
    <circle cx="560" cy="180" r="2" />
    <!-- 4-point Sparkle Star -->
    <path d="M680 870 L685 885 L700 890 L685 895 L680 910 L675 895 L660 890 L675 885 Z" fill="#38bdf8" opacity="0.6" />
  </g>
</svg>
